# Modified by Kodem.
# Checks every pull request and every change to main. The Kodem contract tests (entry point, MCP
# server, viewer) run on macOS, Windows and Linux; the whole upstream suite runs on Linux, as it
# does upstream. Tests that already fail on the upstream base are listed in
# tests/kodem_known_failures.txt and deselected. Pull requests from forks run with a read-only
# token and no secrets.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # uv comes from PyPI, pinned, so that the workflow needs no action outside GitHub's own.
      - run: python -m pip install uv==0.12.4
      - run: uv sync --frozen --extra mcp
      - run: uv run --frozen pytest tests/test_kodem_main.py tests/test_kodem_mcp.py -q --tb=short

  suite:
    name: Suite (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Some upstream tests read earlier commits with `git show`.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # uv comes from PyPI, pinned, so that the workflow needs no action outside GitHub's own.
      - run: python -m pip install uv==0.12.4
      - run: uv sync --frozen --all-extras
      - name: Run the suite
        shell: bash
        run: |
          deselect=()
          while IFS= read -r test; do
            [[ -z "$test" || "$test" == \#* ]] || deselect+=(--deselect "$test")
          done < tests/kodem_known_failures.txt
          uv run --frozen pytest tests -q --tb=short "${deselect[@]}"
